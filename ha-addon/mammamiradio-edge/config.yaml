name: Mamma Mi Radio (Edge)
description: Development channel pinned to the newest tested main image when Edge is deliberately cut. May trail main; use stable for daily listening.
slug: mammamiradio-edge
version: b8f2236
stage: experimental
url: https://github.com/florianhorner/mammamiradio
image: ghcr.io/florianhorner/mammamiradio-addon-{arch}
arch:
  - amd64
  - aarch64
init: false
timeout: 240
healthcheck: http://[HOST]:[PORT:8000]/healthz
host_network: true
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8000
panel_icon: mdi:radio
panel_title: Mamma Mi Radio (Edge)
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Web UI and stream
map:
  - addon_config:rw
backup: hot
backup_exclude:
  - "tmp"
  - "cache/.ytdlp_tmp"
  - "cache/restart_handoff"
  - "cache/clips"
  - "cache/*.mp3"
  - "cache/*.mp3.json"
  - "cache/*.m4a"
  - "cache/*.webm"
  - "*.part"
  - "*.ytdl"
  - "*.tmp"
options:
  station_name: "Mamma Mi Radio"
  enable_home_assistant: true
  ha_context_poll_interval: 300
  ha_media_player_push: true
  quality_profile: "balanced"
  admin_token: ""
  super_italian_mode: false
  chaos_mode_active: false
  festival_mode: false
  broadcast_chain: false
  guest_host: true
  songs_between_banter: 2
  songs_between_ads: 4
  ad_spots_per_break: 2
  norm_cache_mb: 1500
schema:
  station_name: str?
  enable_home_assistant: bool?
  ha_context_enabled: bool?
  ha_context_poll_interval: int(1,3600)?
  ha_media_player_push: bool?
  quality_profile: list(premium|balanced|economy)?
  admin_token: password?
  super_italian_mode: bool?
  chaos_mode_active: bool?
  festival_mode: bool?
  broadcast_chain: bool?
  guest_host: bool?
  songs_between_banter: int(2,60)?
  songs_between_ads: int(1,60)?
  ad_spots_per_break: int(1,5)?
  norm_cache_mb: int(200,8000)?
