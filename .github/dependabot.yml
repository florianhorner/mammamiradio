version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Keep major upgrades standalone so they receive manual compatibility review.
    # Dependabot rewrites only the pins it bumps in the hash-locked requirements.txt
    # and never re-resolves transitive dependencies. pydantic pins an exact
    # pydantic-core, so both ride in the pydantic group; when a grouped PR still
    # leaves the lock incomplete, complete it with pip-compile as described in
    # CONTRIBUTING.md under "Local setup" instead of editing pins by hand.
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pytest*"]
        update-types: ["minor", "patch"]
      core:
        patterns: ["fastapi", "uvicorn", "anthropic", "spotipy"]
        update-types: ["minor", "patch"]
      pydantic:
        patterns: ["pydantic", "pydantic-core", "pydantic-settings"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: "scope"
