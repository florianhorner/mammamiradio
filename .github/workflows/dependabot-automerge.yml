name: Dependabot Automerge

# Arms auto-merge for Dependabot patch and minor updates, and keeps them out of
# the release cut window.
#
# The cut window: main advertises an add-on version GHCR does not publish yet
# (between the `chore(release): cut` merge and the second promote job). A
# Dependabot merge inside it moves main off the cut commit with no push CI and
# no :sha image behind it (GITHUB_TOKEN merges fire no push workflows), so the
# edge soak cannot pin the result and a tag on HEAD would publish an unsoaked
# tree. On 2026-09-02 #1082 had been armed 2.5 days before the 3.0.0 cut and
# merged 16 minutes after it. Refusing to arm was never enough; an open window
# has to disarm, and PR events alone never see a window open or close, so a
# sweep runs on the cut commit itself, hourly, and on demand.
#
# The oracle is the registry (scripts/check-advertised-version.sh), never a flag
# a human has to remember to set and clear. PRs this workflow disarms carry the
# cut-window-hold label. The sweep only disarms. Arming still requires verified
# Dependabot metadata on a fresh PR event; major updates need manual landing.
# This is asynchronous reconciliation, not an atomic cut lock: preserve strict
# branch freshness and disarm/freeze the queue before landing the release cut.

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
  push:
    branches: [main]
    paths:
      - ha-addon/mammamiradio/config.yaml
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  enable-automerge:
    if: github.repository == 'florianhorner/mammamiradio' && github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Read the current trusted main, not the older event SHA or PR head.
      # A queued pre-cut event must not probe a previously published version.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      # Read the verdict line, not the exit code: the script exits 1 on fail, and
      # `run:` is `bash -e`, so the capture must not abort the step. Same parse as
      # advertised-version.yml; tests/workflows/test_dependabot_automerge_gate.sh
      # keeps both readers in step.
      - name: Read the advertised-version verdict
        id: advertised
        run: |
          set +e
          OUTPUT="$(bash scripts/check-advertised-version.sh 2>&1)"
          set -e
          echo "$OUTPUT"
          VERDICT="$(printf '%s\n' "$OUTPUT" | sed -n 's/^VERDICT: //p' | tail -1)"
          [ -n "$VERDICT" ] || VERDICT="unknown"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Fetch Dependabot metadata
        id: metadata
        if: steps.advertised.outputs.verdict == 'pass'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Note: the approval step is intentionally absent.
      # GitHub Actions cannot self-approve PRs (403 on addPullRequestReview).
      # Branch protection has no required reviewer count, so CI-pass + auto-merge
      # is sufficient.

      - name: Enable automerge for patch and minor updates
        if: >-
          steps.advertised.outputs.verdict == 'pass' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: bash scripts/dependabot-window-hold.sh arm "$PR_NUMBER" "$PR_HEAD_SHA" "$(git rev-parse HEAD)"

      - name: Disarm automerge while the cut window is open
        if: steps.advertised.outputs.verdict == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/dependabot-window-hold.sh disarm "$PR_NUMBER"

      - name: Leave state unchanged when the registry cannot be reached
        if: steps.advertised.outputs.verdict == 'unknown'
        run: echo "::notice::advertised-version check returned unknown (registry unreachable); auto-merge state left as is."

  # Reconcile every open Dependabot PR with the window. Runs when the cut commit
  # lands (push to main touching config.yaml), hourly, and on demand, because a
  # PR that was armed days ago gets no event when the window opens.
  sweep:
    if: github.repository == 'florianhorner/mammamiradio' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false

      - name: Read the advertised-version verdict
        id: advertised
        run: |
          set +e
          OUTPUT="$(bash scripts/check-advertised-version.sh 2>&1)"
          set -e
          echo "$OUTPUT"
          VERDICT="$(printf '%s\n' "$OUTPUT" | sed -n 's/^VERDICT: //p' | tail -1)"
          [ -n "$VERDICT" ] || VERDICT="unknown"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Reconcile open Dependabot PRs with the cut window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERDICT: ${{ steps.advertised.outputs.verdict }}
        run: bash scripts/dependabot-window-hold.sh sweep "$VERDICT"
