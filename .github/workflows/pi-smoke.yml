name: Pi Smoke (aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "train/**"]

jobs:
  pi-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install static ffmpeg compatibility build (arm64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # This is an arm64 compatibility canary, not an exact add-on package
        # mirror. It accepts 7.x/8.x to exercise the known FFmpeg 8.x ARM crash
        # surface. JVS is primary; BtbN's floating tag is a digest-verified
        # fallback so one host outage or release rotation cannot fail the gate.
        run: |
          set -euo pipefail
          cd /tmp
          download_jvs() {
            curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 3 --retry-connrefused --retry-all-errors \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz \
              -o ffmpeg.tar.xz
          }
          download_btbn() {
            local asset_metadata asset_url asset_digest expected_sha
            asset_metadata="$(
              curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 3 --retry-connrefused --retry-all-errors \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest |
                jq -er '(
                  [
                    .assets[]
                    | select(.name | test("^ffmpeg-n(7\\.[0-9]+-latest-linuxarm64-gpl-7\\.[0-9]+|8\\.[0-9]+-latest-linuxarm64-gpl-8\\.[0-9]+)\\.tar\\.xz$"))
                  ]
                  | sort_by(.name)
                  | last // empty
                ) | [.browser_download_url, .digest] | @tsv'
            )" || {
              echo "::error::BtbN latest tag has no supported FFmpeg 7.x/8.x Linux arm64 GPL build"
              return 1
            }
            IFS=$'\t' read -r asset_url asset_digest <<< "$asset_metadata"
            if [[ ! "$asset_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::BtbN did not publish a SHA-256 digest for the selected asset"
              return 1
            fi
            expected_sha="${asset_digest#sha256:}"
            curl -fsSL --connect-timeout 15 --retry 3 --retry-delay 3 --retry-connrefused --retry-all-errors \
              "$asset_url" \
              -o ffmpeg.tar.xz
            printf '%s  ffmpeg.tar.xz\n' "$expected_sha" |
              sha256sum --check --strict -
          }
          download_jvs || { echo "::warning::John Van Sickle ffmpeg unreachable — falling back to BtbN"; download_btbn; }
          rm -rf ffmpeg-static && mkdir -p ffmpeg-static
          tar -xJf ffmpeg.tar.xz -C ffmpeg-static --strip-components=1
          # JVS keeps the binaries at the tarball root; BtbN nests them under bin/.
          # Locate them rather than hardcoding a layout.
          ff="$(find ffmpeg-static -type f -name ffmpeg | head -1)"
          fp="$(find ffmpeg-static -type f -name ffprobe | head -1)"
          sudo install -m 0755 "$ff" /usr/local/bin/ffmpeg
          sudo install -m 0755 "$fp" /usr/local/bin/ffprobe
          ffmpeg -version | head -1
          ffmpeg -version | head -1 | grep -E 'ffmpeg version (7|n7|8|n8)'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run normalizer smoke tests (mocked)
        run: pytest tests/audio/test_normalizer_unit.py tests/audio/test_normalizer_extended.py -v

      - name: Run normalizer real-ffmpeg integration tests
        run: pytest tests/audio/test_normalizer_real_ffmpeg.py -m requires_ffmpeg -v

      - name: Fresh-process listener-to-first-byte smoke (<= 2s)
        # The perf smoke assumes an already-running station; this launches a real
        # cold uvicorn on temp cache/tmp, waits separately for TCP readiness, and
        # then asserts a connecting listener hears audio within the 1-2s INSTANT
        # AUDIO promise (default <= 2s). This is request-to-first-byte, not
        # process-spawn-to-audio; startup has its own 60s readiness budget.
        # Invoke the script directly: this job installs into the system Python,
        # so `make launch-smoke` (which uses .venv/bin/python) would not resolve.
        run: python scripts/ha-green-launch-smoke.py
