name: Model registry watch

# Weekly nag for model_registry.toml: is it still decided lately, and are its pins
# still current at the providers? Runs scripts/check_model_registry.py --report,
# which asks both questions against the public provider docs, no API keys needed.
#
# This is the weekly half of the watch. The other half runs at the release cut
# (scripts/pre-release-check.sh section 11) and gates on age plus liveness only.
# This job is deliberately NOT a PR check: a calendar assertion on unrelated PRs
# gets bumped reflexively, which is the failure the review stamp exists to prevent.
#
# Issue posture is cloned from advertised-version.yml, with one deliberate change.
# There, an unreachable registry leaves the issue alone, because addon-release.yml
# is the loud primary detector and a blip must not close a live drift issue. Here
# --report IS the only detector, and its own contract says a broken scraper must
# never look green. So exit 2 (docs unreadable, parser lost its anchors) opens or
# keeps the issue too, with a body that says the watcher itself needs attention.
# The cost is a weekly issue during a provider-docs outage; it closes itself on
# the next clean run. The alternative is a watcher that dies silently.
#
#   exit 0  clean           -> close any open watch issue
#   exit 1  a finding       -> open the issue, or comment this week's report on it
#   exit 2  watcher broken  -> same, with a body that names the watcher, not a pin

on:
  schedule:
    # 09:20 UTC every Monday. Off the hour to avoid the scheduler's busiest minute.
    - cron: "20 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-registry-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # A fork running this by workflow_dispatch would file an issue on the fork about
    # someone else's registry.
    if: github.repository == 'florianhorner/mammamiradio'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The checker is stdlib-only (tomllib needs 3.11+; ubuntu-latest ships newer),
      # so there is no dependency install and no venv to keep in sync.
      - name: Run the weekly report
        id: report
        run: |
          set +e
          OUTPUT="$(python3 scripts/check_model_registry.py --report 2>&1)"
          RC=$?
          set -e
          echo "$OUTPUT"
          case "$RC" in
            0) VERDICT=pass ;;
            1) VERDICT=fail ;;
            *) VERDICT=broken ;;
          esac
          {
            echo "output<<GHEOF"
            echo "$OUTPUT"
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open, comment on, or close the watch issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.report.outputs.verdict }}
          DETAIL: ${{ steps.report.outputs.output }}
          TITLE: "Model registry needs a decision"
          LABEL: "model-registry-watch"
        run: |
          # The single-quoted printf args below are literal markdown; the backticks
          # are code fences, not command substitution, so they are deliberately not
          # expanded.
          set -euo pipefail

          # Strongly-consistent REST list, not --search: the search index lags. Match
          # on the label, not the title, so an edited title does not orphan the issue.
          EXISTING="$(gh issue list --state open --label "$LABEL" --limit 100 \
            --json number --jq '[.[].number] | first // empty')"

          if [ "$VERDICT" = "pass" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "This week's report is clean: every pin is current and the review stamp is fresh. Closing automatically."
            else
              echo "Registry is decided and current; nothing to report."
            fi
            exit 0
          fi

          BODY="$RUNNER_TEMP/model-registry-watch.md"
          if [ "$VERDICT" = "broken" ]; then
            {
              printf '%s\n\n' 'The weekly model registry watch could not read the provider documentation, so it cannot say whether the pinned models are still current.'
              printf '%s\n' '```'
              printf '%s\n' "$DETAIL"
              printf '%s\n\n' '```'
              printf '%s\n' '**Fix:** run `python scripts/check_model_registry.py --providers` locally. If it fails the same way, the provider pages changed shape and the parser in `scripts/check_model_registry.py` needs its anchors updated. If it passes locally, this was a transient outage and the next weekly run closes this on its own.'
            } > "$BODY"
          else
            {
              printf '%s\n\n' 'The weekly model registry watch found something to decide: a pinned model is no longer current at its provider, or `model_registry.toml` has not been reviewed in over 45 days.'
              printf '%s\n' '```'
              printf '%s\n' "$DETAIL"
              printf '%s\n\n' '```'
              printf '%s\n' '**Fix:** run `python scripts/check_model_registry.py --providers`, decide each flagged pin (bump it or deliberately hold it), then set `last_reviewed` in `model_registry.toml` to today and say which in the comment beside it. Holding is a valid decision; an undated one is not.'
              printf '%s\n\n' 'This is the weekly half of the watch. The release cut runs the same check for age and liveness and refuses to cut on a stale stamp.'
            } > "$BODY"
          fi
          printf '%s\n' 'This issue closes itself once a weekly run comes back clean.' >> "$BODY"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY"
            echo "Updated #$EXISTING with this week's report."
            exit 0
          fi
          # Idempotent: succeeds the first time, harmless every time after.
          gh label create "$LABEL" \
            --description "model_registry.toml has a pin that is not current or a review stamp older than 45 days" \
            --color B60205 2>/dev/null || true
          gh issue create --title "$TITLE" --label "$LABEL" --body-file "$BODY"
