name: Model registry watch

# Weekly decision watch. --report checks review age and provider status, honoring
# only dated exact-pin legacy/unlisted holds. Release cuts independently use age
# plus liveness; holds never suppress deprecation or retirement.
# An issue tracks the latest report; subscribers receive a comment only when the
# report changes. Only the running age counter is normalized for deduplication.
# Broken checks remain visible and never close an existing issue.

on:
  schedule:
    # 09:20 UTC every Monday. Off the hour to avoid the scheduler's busiest minute.
    - cron: "20 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-registry-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A fork running this by workflow_dispatch would file an issue on the fork about
    # someone else's registry.
    if: github.repository == 'florianhorner/mammamiradio'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The checker is stdlib-only (tomllib needs 3.11+; ubuntu-latest ships newer),
      # so there is no dependency install and no venv to keep in sync.
      - name: Run the weekly report
        id: report
        run: |
          set +e
          OUTPUT="$(python3 scripts/check_model_registry.py --report 2>&1)"
          RC=$?
          set -e
          echo "$OUTPUT"
          # Exit 1 is a finding only if a report was actually rendered. Every
          # report carries at least one '== ' section header; a traceback has none.
          case "$RC" in
            0) VERDICT=pass ;;
            1) if printf '%s\n' "$OUTPUT" | grep -q '^== '; then VERDICT=fail; else VERDICT=broken; fi ;;
            *) VERDICT=broken ;;
          esac
          {
            echo "output<<GHEOF"
            echo "$OUTPUT"
            echo "GHEOF"
          } >> "$GITHUB_OUTPUT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open, update, or close the watch issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.report.outputs.verdict }}
          DETAIL: ${{ steps.report.outputs.output }}
          LABEL: "model-registry-watch"
        run: |
          # The single-quoted printf args below are literal markdown; the backticks
          # are code fences, not command substitution, so they are deliberately not
          # expanded.
          set -euo pipefail

          # Strongly-consistent REST list, not --search: the search index lags. Match
          # on the label, not the title, so an edited title does not orphan the issue.
          EXISTING="$(gh issue list --state open --label "$LABEL" --limit 100 \
            --json number --jq '[.[].number] | first // empty')"

          if [ "$VERDICT" = "pass" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "This week's report has no pending decisions: pins are current or explicitly held, no lifecycle warnings were found, and review dates are fresh. Closing automatically."
            else
              echo "Registry has no pending decisions; nothing to report."
            fi
            exit 0
          fi

          BODY="$RUNNER_TEMP/model-registry-watch.md"
          if [ "$VERDICT" = "broken" ]; then
            TITLE="Model registry watch could not complete"
            {
              printf '%s\n\n' 'The weekly model registry watch could not complete its checks, so it cannot verify the review stamp and pinned models.'
              printf '%s\n' '```'
              printf '%s\n' "$DETAIL"
              printf '%s\n\n' '```'
              printf '%s\n' '**Fix:** run `python3 scripts/check_model_registry.py --report` locally with Python 3.11 or newer and read the reported error. Check provider availability or page parsing for documentation errors, `model_registry.toml` for registry errors, and the Python environment or checker code for import, syntax, or other crashes. If the report passes locally, compare the failed run logs and environment before concluding the problem was temporary.'
            } > "$BODY"
          else
            TITLE="Model registry needs a decision"
            {
              printf '%s\n\n' 'The weekly model registry watch found something to decide: a pin has new or unaccepted provider drift, a lifecycle warning, an invalid or expired hold, or a review stamp older than 45 days.'
              printf '%s\n' '```'
              printf '%s\n' "$DETAIL"
              printf '%s\n\n' '```'
              printf '%s\n' '**Fix:** run `python3 scripts/check_model_registry.py --report` and inspect raw drift with `--providers`. Decide each finding. For a deliberate legacy/unlisted hold, record the exact pin, status, reason and review dates under `[model_watch.holds]` (see `docs/release-process.md`). Update `last_reviewed` only after an actual review. Deprecation and retirement cannot be held.'
              printf '%s\n\n' 'The release cut separately checks review age and liveness. Watch holds never waive those checks.'
            } > "$BODY"
          fi
          printf '%s\n' 'This issue closes itself once a weekly run comes back clean.' >> "$BODY"

          # Keep dates, status changes and failures in the identity. Only a line's
          # running age changes harmlessly between otherwise identical reports.
          FINGERPRINT="$(sed -E '/^(OK|FAIL): model_registry\.toml last_reviewed=/s/is [0-9]+ days old/is <age> days old/' "$BODY" | sha256sum | cut -d ' ' -f1)"
          MARKER="<!-- model-registry-watch:$FINGERPRINT -->"
          printf '\n%s\n' "$MARKER" >> "$BODY"
          if [ -n "$EXISTING" ]; then
            PREVIOUS="$(gh issue view "$EXISTING" --json body --jq .body)"
            if printf '%s\n' "$PREVIOUS" | grep -qFx -- "$MARKER"; then
              echo "Unchanged findings already tracked in #$EXISTING."
              exit 0
            fi
            gh issue comment "$EXISTING" --body-file "$BODY"
            gh issue edit "$EXISTING" --title "$TITLE" --body-file "$BODY"
            echo "Updated #$EXISTING with a changed report."
            exit 0
          fi
          # --force updates an existing label instead of erroring, which makes this
          # idempotent without swallowing a real failure: if the token cannot manage
          # labels, the run goes red here with gh's own message rather than one line
          # later on a missing label.
          gh label create "$LABEL" --force \
            --description "Model registry has an unaccepted change, lifecycle warning, or overdue review" \
            --color B60205
          gh issue create --title "$TITLE" --label "$LABEL" --body-file "$BODY"
