name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "train/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      media: ${{ steps.filter.outputs.media }}
      workflows: ${{ steps.filter.outputs.workflows }}
      audio: ${{ steps.filter.outputs.audio }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify expensive lanes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci-changed-lanes.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-ci

      - name: ShellCheck scripts
        # Pinned to v0.11.0 by digest, matching this job's other supply-chain-hardened steps.
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d scripts/*.sh

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Admin panel standards check
        if: github.event_name == 'pull_request'
        run: bash scripts/check-admin-standards.sh

      - name: Changelog content lint
        run: bash scripts/check-changelog-lint.sh

      - name: Documentation safety lint
        run: bash scripts/check-docs-safety.sh

      - name: Backlog-file guard
        run: bash scripts/check-no-backlog-files.sh

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-ci

      - name: Mypy
        run: mypy mammamiradio/ tests/

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-ci
        with:
          install-ffmpeg: "true"

      # `addopts = -m 'not requires_ffmpeg'` deselects these by default, so the
      # coverage gate below never runs them. They are the only proof that a
      # manifest-approved payload which is not really audio still fails ffprobe.
      - name: Browser narration ffmpeg guards
        run: python -m pytest tests/web/test_first_listen_narration_assets.py -m requires_ffmpeg -q

      # Enforce per-module coverage floors (no regressions allowed).
      # `coverage-ratchet.py check` runs pytest internally with coverage flags
      # and hard-exits on returncode != 0 (scripts/coverage-ratchet.py:72-78),
      # so it doubles as the test gate — no separate `pytest tests/` step needed.
      - name: Coverage gate (runs pytest + per-module floors)
        env:
          COVERAGE_RATCHET_SNAPSHOT: coverage-ratchet-current.json
          COVERAGE_RATCHET_XDIST: auto
        run: python scripts/coverage-ratchet.py check

      - name: Upload coverage ratchet snapshot
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: coverage-ratchet-current
          path: coverage-ratchet-current.json
          if-no-files-found: error

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Version-sync and several workflow self-tests walk git history
          # (origin/main...HEAD, HEAD~1). A shallow clone false-fails those.
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-ci
        with:
          install-ffmpeg: "true"

      - name: Release cooldown gate self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_cooldown_gate.sh

      - name: Issue-body lint self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_issue_body_lint.sh

      - name: Cut-edge-release self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_cut_edge_release.sh

      - name: Advertised-version guard self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_advertised_version.sh

      - name: Edge add-on validation self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_validate_addon_edge.sh

      - name: Addon owner-fallback self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_validate_addon_owner.sh

      - name: Pre-ship squad gate self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_preship_squad_gate.sh

      - name: Pre-ship evidence self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_preship_evidence.sh

      - name: Landing wrapper self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_land_pr.sh

      - name: Dependabot nudge self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_dependabot_nudge.sh

      - name: Merge-gate drift check self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_check_merge_gate.sh

      - name: Documentation safety lint self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_docs_safety.sh

      - name: Changed-lanes filter self-test
        if: needs.changes.outputs.workflows == 'true'
        run: bash tests/workflows/test_ci_changed_lanes.sh

      # On every PR: audio delivery invariants (FFmpeg eq count, empty-fallback test, post-restart test)
      - name: Release invariants
        if: github.event_name == 'pull_request'
        run: bash scripts/check-release-invariants.sh

      # On PRs that touch version files: full version-sync check
      # (pyproject.toml ↔ config.yaml ↔ custom_components/mammamiradio/manifest.json ↔ CHANGELOG)
      - name: Version sync check
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/main...HEAD | grep -qE 'pyproject\.toml|ha-addon/mammamiradio/config\.yaml|custom_components/mammamiradio/manifest\.json'; then
            echo "Version file changed — running full pre-release check..."
            bash scripts/pre-release-check.sh
          else
            echo "No version files changed — skipping version sync check."
          fi

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.browser == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-ci

      - name: Set up Node.js for browser smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.1"
          check-latest: false

      - name: Install listener smoke browser
        timeout-minutes: 10
        run: |
          PLAYWRIGHT_CLI_VERSION="$(tr -d '[:space:]' < .playwright-cli-version)"
          npx --yes --package "@playwright/cli@$PLAYWRIGHT_CLI_VERSION" playwright-cli install-browser chromium --with-deps --only-shell

      - name: Listener interaction browser smoke
        timeout-minutes: 10
        env:
          ADMIN_PASSWORD: ""
          ADMIN_TOKEN: ""
          ADMIN_BROWSER_SMOKE_URL: http://127.0.0.1:8765
          MAMMAMIRADIO_ALLOW_YTDLP: "false"
          MAMMAMIRADIO_BIND_HOST: "127.0.0.1"
          MAMMAMIRADIO_CACHE_DIR: ${{ runner.temp }}/player-smoke-cache
          MAMMAMIRADIO_PORT: "8765"
          MAMMAMIRADIO_TMP_DIR: ${{ runner.temp }}/player-smoke-tmp
          PLAYER_SMOKE_CLI_TIMEOUT_SEC: "90"
          PLAYER_SMOKE_CLOSE_TIMEOUT_SEC: "15"
          PLAYER_SMOKE_URL: http://127.0.0.1:8765
        run: |
          set -euo pipefail
          mkdir -p "$MAMMAMIRADIO_CACHE_DIR" "$MAMMAMIRADIO_TMP_DIR"
          server_log="$RUNNER_TEMP/player-smoke-server.log"
          setsid python -m uvicorn mammamiradio.main:app \
            --host "$MAMMAMIRADIO_BIND_HOST" \
            --port "$MAMMAMIRADIO_PORT" \
            --no-access-log \
            >"$server_log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              for _ in {1..20}; do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
            fi
            if kill -0 "$server_pid" 2>/dev/null; then
              echo "Smoke server did not stop after TERM; sending KILL." >&2
              kill -KILL -- "-$server_pid" 2>/dev/null || true
            fi
            wait "$server_pid" 2>/dev/null || true
            if [[ "$status" -ne 0 ]]; then
              echo "--- player smoke server log ---" >&2
              cat "$server_log" >&2 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent "http://127.0.0.1:$MAMMAMIRADIO_PORT/healthz" >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Listener smoke server exited before becoming healthy." >&2
              exit 1
            fi
            sleep 0.5
          done
          if [[ "$ready" != "true" ]]; then
            echo "Listener smoke server did not become healthy." >&2
            exit 1
          fi

          make player-smoke
          python -m pytest tests/web/test_admin_browser_smoke.py -q
          python -m pytest tests/web/test_first_listen_browser_smoke.py -q

  media-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.media == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The audio-pack validator reads generator inputs at the exact Git
          # revision pinned in the provenance manifest. That revision can be
          # older than HEAD~1, so a shallow checkout cannot prove the hashes.
          fetch-depth: 0

      - uses: ./.github/actions/setup-python-ci
        with:
          install-ffmpeg: "true"

      # Report-only while the twelve starter tracks are absent by design: the
      # proof still runs and uploads its report, but this lane does not fail on
      # the missing content. The hard gate stays in scripts/pre-release-check.sh
      # (section 10), so release remains blocked until the content lands.
      - name: Media-rights report (report-only)
        run: |
          if python scripts/media-proof.py --quick --output media-proof.json; then
            echo "media-proof: PASS"
          else
            echo "NOTICE: media-proof reported missing content: the twelve starter-catalog tracks (normalized audio and human-audition evidence under mammamiradio/assets/starter/) have not landed yet."
            echo "NOTICE: this lane is report-only; scripts/pre-release-check.sh still fails hard on this proof on the release path."
          fi

      - name: Upload strict media proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: media-proof-quality-${{ github.sha }}
          path: media-proof.json
          if-no-files-found: error

  quality:
    if: always() && !cancelled()
    needs: [changes, lint, types, tests, invariants, browser-smoke, media-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: All quality lanes passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TYPES: ${{ needs.types.result }}
          TESTS: ${{ needs.tests.result }}
          INVARIANTS: ${{ needs.invariants.result }}
          BROWSER: ${{ needs.browser-smoke.result }}
          MEDIA: ${{ needs.media-report.result }}
        run: |
          set -euo pipefail
          require_success() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ]; then
              echo "$name lane was $result" >&2
              exit 1
            fi
          }
          require_ok() {
            name="$1"
            result="$2"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "$name lane was $result" >&2
              exit 1
            fi
          }
          require_success changes "$CHANGES"
          require_success lint "$LINT"
          require_success types "$TYPES"
          require_success tests "$TESTS"
          require_success invariants "$INVARIANTS"
          require_ok browser-smoke "$BROWSER"
          require_ok media-report "$MEDIA"

  coverage-ratchet:
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Download coverage ratchet snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: coverage-ratchet-current

      # On main: auto-ratchet floors up and commit if changed.
      # The coverage numbers come from the read-only tests job artifact, so
      # only this commit step needs a write-capable token.
      - name: Coverage ratchet (auto-update floors)
        env:
          COVERAGE_RATCHET_INPUT: coverage-ratchet-current.json
        run: |
          python scripts/coverage-ratchet.py update

          # If floors changed, commit them back
          if ! git diff --quiet .coverage-floors.json pyproject.toml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .coverage-floors.json pyproject.toml
            git commit -m "ci: auto-ratchet coverage floors

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push || echo "⚠️  Push blocked by branch protection — coverage floor update skipped. Run 'make coverage-ratchet' and open a PR to apply manually."
          fi
