name: preship-evidence

# Runtime-independent pre-ship squad check, phase 1: REPORT-ONLY.
#
# The local enforcement (scripts/hooks/require-preship-squad.sh) is a Claude Code
# PreToolUse hook — Codex has no hook layer, so ~60% of sessions could open PRs with no
# squad check at all. This workflow closes that gap server-side by verifying the
# committed evidence artifact (proof/preship-review/pr-<n>.json for schema v2, or the
# legacy proof/preship-review.json during migration), written by
# scripts/emit-review-evidence.sh.
#
# Anti-neutering (same pattern as pr-body-lint.yml): the CHECKER runs from the BASE ref,
# and only the evidence FILE is read from the PR head via `git show`. Running the head's
# own copy of the checker would let a PR doctor the checker and approve itself in the
# same commit — precisely the class of bypass a server-side gate exists to prevent.
#
# Report-only on purpose: it annotates instead of failing, so the baseline of real
# behavior is observable before anything blocks. Flipping to blocking = fail instead of
# warn below, plus adding this check to the main ruleset's required contexts — an
# explicit phase-2 decision, not a default.
#
# Dependabot is skipped: bot PRs have no squad and never will; annotating them weekly
# is noise with no decision attached.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  evidence:
    name: pre-ship evidence (report-only)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Base ref: the checker and this job's logic come from code the PR cannot touch.
          ref: ${{ github.event.pull_request.base.sha }}
          # Full history: the checker walks ancestry (merge-base --is-ancestor), which a
          # shallow clone breaks with a false "not an ancestor".
          fetch-depth: 0

      - name: Check pre-ship review evidence
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f scripts/check-preship-evidence.sh ]; then
            echo "scripts/check-preship-evidence.sh not present on base ref — skipping (activates once merged to base)."
            exit 0
          fi
          # Bring the PR head's objects into this base-ref clone, then read ONLY the
          # evidence file from it. The head's scripts are never executed.
          git fetch --no-tags origin "$HEAD_SHA"
          V2_PATH="proof/preship-review/pr-${PR_NUMBER}.json"
          LEGACY_PATH="proof/preship-review.json"
          if git show "$HEAD_SHA:$V2_PATH" > /tmp/preship-evidence.json 2>/dev/null; then
            echo "Using schema v2 evidence at $V2_PATH"
          elif git show "$HEAD_SHA:$LEGACY_PATH" > /tmp/preship-evidence.json 2>/dev/null; then
            echo "::warning::Using legacy $LEGACY_PATH — migrate to $V2_PATH via scripts/emit-review-evidence.sh"
          else
            echo "::warning::No pre-ship evidence on this PR (expected $V2_PATH). Run the review squad, then scripts/emit-review-evidence.sh, and commit the artifact. (Report-only — not blocking yet.)"
            exit 0
          fi
          if bash scripts/check-preship-evidence.sh /tmp/preship-evidence.json "$HEAD_SHA"; then
            echo "::notice::pre-ship review evidence verified for this PR head."
          else
            echo "::warning::pre-ship review evidence INVALID for this PR (see log above). Re-run the squad on this branch and re-emit. (Report-only — not blocking yet.)"
          fi
