name: preship-evidence

# Runtime-independent pre-ship squad check, phase 1: REPORT-ONLY.
#
# The local enforcement (scripts/hooks/require-preship-squad.sh) is a Claude Code
# PreToolUse hook — Codex has no hook layer, so ~60% of sessions could open PRs with no
# squad check at all. This workflow narrows that gap server-side by verifying the
# committed evidence: the immutable content-addressed v2 receipt under
# proof/preship-reviews/v2/. (The legacy fixed-name v1 file is retired — a fixed name
# meant every pair of concurrent PRs conflicted on evidence.)
#
# Data-plane hardening (same pattern as pr-body-lint.yml): the CHECKER runs from the
# BASE ref, and only evidence DATA comes from the PR head. Running the head's own
# checker would let a PR doctor the checker and approve itself in the same commit.
# The pull_request workflow definition itself is still PR-controlled in this
# report-only phase. Before this becomes a required check, orchestration must move to
# a base-owned control plane that reports against the exact PR head.
#
# Report-only on purpose: it annotates instead of failing, so the baseline of real
# behavior is observable before anything blocks. Flipping to blocking = fail instead of
# warn below, plus adding this check to the main ruleset's required contexts — an
# explicit phase-2 decision, not a default.
#
# Dependabot is skipped: bot PRs have no squad and never will; annotating them weekly
# is noise with no decision attached.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  evidence:
    name: pre-ship evidence (report-only)
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Base ref: checker files come from code the PR cannot touch. The workflow
          # definition remains PR-controlled during this report-only bootstrap phase.
          ref: ${{ github.event.pull_request.base.sha }}
          # Full history: the checker walks ancestry (merge-base --is-ancestor), which a
          # shallow clone breaks with a false "not an ancestor".
          fetch-depth: 0

      - name: Fetch untrusted PR head data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_base="$(git rev-parse HEAD)"
          if [ "$actual_base" != "$BASE_SHA" ]; then
            echo "::error::Trusted checker checkout is $actual_base, expected base $BASE_SHA."
            exit 1
          fi
          # Fetch objects only. Never check out the PR head or execute code from it.
          git fetch --no-tags origin "$HEAD_SHA"

      - name: Check v2 pre-ship review evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/landing/__main__.py ]; then
            echo "::notice::v2 evidence was not evaluated because this PR's base predates the v2 verifier; integrate current main to get the check."
            exit 0
          fi
          # Invoke the trusted-base package directly. The shell wrapper's venv and
          # interpreter override are local conveniences; hosted CI intentionally uses
          # its runner Python with isolated import paths.
          if PYTHONPATH="$GITHUB_WORKSPACE" python3 -S -P -m scripts.landing evidence verify \
            --target "$HEAD_SHA" --base "$BASE_SHA" --mode pr; then
            echo "::notice::v2 pre-ship review evidence verified for this PR head."
          else
            echo "::warning::v2 pre-ship review evidence is invalid (see log above). Re-review the exact content and emit v2. (Report-only — not blocking yet.)"
          fi
