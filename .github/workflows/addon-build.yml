name: Build HA Addon

on:
  push:
    branches: [main]
    paths:
      - "ha-addon/**"
      - "mammamiradio/**"
      - "proof/media/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "radio.toml"
      - "model_registry.toml"
      - "scripts/media-proof.py"
      - "scripts/starter-catalog.py"
      - "scripts/validate-addon.sh"
      - "scripts/validate-starter-media.py"
      - "scripts/ha-green-launch-smoke.py"
      - "scripts/ha-green-perf-smoke.py"
      - "tests/media/**"
      - "tests/playlist/test_jamendo_transient.py"
      - "tests/playlist/test_legacy_media.py"
      - "tests/scheduling/test_queue_mutations.py"
      - "tests/web/test_streamer_routes_extended.py"
      - ".github/workflows/addon-build.yml"
  workflow_dispatch:

# Serialize runs on the same ref so two near-simultaneous merges don't run
# redundant concurrent image builds.
concurrency:
  group: addon-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/mammamiradio-addon

jobs:
  validate:
    runs-on: ubuntu-latest
    # Skip the redundant rebuild when the push is a manual edge-release commit
    # (`chore(edge): cut edge release <sha>`): the image for that SHA already
    # exists; the commit only advanced the edge add-on's version: field.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(edge): cut edge release')
    outputs:
      addon_version: ${{ steps.addon-version.outputs.version }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install FFmpeg for strict media validation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # Report-only while the twelve starter tracks are absent by design: the
      # proof still runs and uploads its report, but validate does not fail on
      # the missing content. The stable promotion media-proof job in
      # addon-release.yml and the hard gate in scripts/pre-release-check.sh
      # (section 10) keep the release path blocked until the content lands.
      - name: Media-rights report (report-only)
        run: |
          if python scripts/media-proof.py --quick --output media-proof.json; then
            echo "media-proof: PASS"
          else
            echo "NOTICE: media-proof reported missing content: the twelve starter-catalog tracks (normalized audio and human-audition evidence under mammamiradio/assets/starter/) have not landed yet."
            echo "NOTICE: this job is report-only; scripts/pre-release-check.sh still fails hard on this proof on the release path."
          fi

      - name: Upload strict media proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: media-proof-quick-${{ github.sha }}
          path: media-proof.json
          if-no-files-found: error

      - name: Validate add-on invariants
        run: bash scripts/validate-addon.sh

      - name: Read stable add-on version
        id: addon-version
        run: |
          set -e
          VERSION=$(grep '^version:' ha-addon/mammamiradio/config.yaml | awk '{print $2}' | tr -d '"')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to extract version from ha-addon/mammamiradio/config.yaml — is the version: field present?"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Stable add-on version: $VERSION"

      - name: Compute short SHA (edge image tag)
        id: sha
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Edge image short SHA: $SHORT_SHA"

  build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.20
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Copy source into addon build context
        run: |
          cp -r mammamiradio/ ha-addon/mammamiradio/mammamiradio/
          cp pyproject.toml ha-addon/mammamiradio/
          cp model_registry.toml ha-addon/mammamiradio/

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ha-addon/mammamiradio
          file: ha-addon/mammamiradio/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_VERSION=${{ needs.validate.outputs.addon_version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ needs.validate.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export unpushed image
        env:
          SHA_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
          SHORT_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ needs.validate.outputs.short_sha }}
          IMAGE_TAR: ${{ runner.temp }}/addon-image-${{ matrix.arch }}.tar
        run: |
          set -euo pipefail
          docker image inspect "$SHA_REF" "$SHORT_REF" >/dev/null
          docker save --output "$IMAGE_TAR" "$SHA_REF" "$SHORT_REF"

      - name: Upload unpushed image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: addon-image-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/addon-image-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0

  media-proof:
    runs-on: ubuntu-latest
    needs: [validate, build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install full media-proof dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install uv==0.10.11
          python -m pip install -e . -r requirements-dev.txt

      - name: Download unpushed amd64 image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: addon-image-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/images/amd64

      - name: Download unpushed aarch64 image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: addon-image-aarch64-${{ github.sha }}
          path: ${{ runner.temp }}/images/aarch64

      - name: Load both unpushed images
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/images/amd64/addon-image-amd64.tar"
          docker load --input "$RUNNER_TEMP/images/aarch64/addon-image-aarch64.tar"

      # Report-only while the twelve starter tracks are absent by design: the
      # full proof still runs against both unpushed images and uploads its
      # report, but this job does not fail on the missing content — publish
      # needs this job, so a hard failure here still blocks every image publish
      # and the edge channel. The stable promotion media-proof job in
      # addon-release.yml and the hard gate in scripts/pre-release-check.sh
      # (section 10) keep the release path blocked until the content lands.
      - name: Prove source, packages, and both built images (report-only)
        env:
          AMD64_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-amd64:${{ github.sha }}
          AARCH64_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-aarch64:${{ github.sha }}
        run: |
          if python scripts/media-proof.py \
            --amd64-image "$AMD64_IMAGE" \
            --aarch64-image "$AARCH64_IMAGE" \
            --output media-proof.json; then
            echo "media-proof: PASS"
          else
            echo "NOTICE: media-proof reported missing content: the twelve starter-catalog tracks (normalized audio and human-audition evidence under mammamiradio/assets/starter/) have not landed yet."
            echo "NOTICE: this job is report-only; the stable promotion media-proof job in addon-release.yml and scripts/pre-release-check.sh section 10 still fail hard on this proof on the release path."
          fi

      - name: Upload full media proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: media-proof-full-${{ github.sha }}
          path: media-proof.json
          if-no-files-found: error

  push:
    runs-on: ubuntu-latest
    needs: [validate, media-proof]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
    steps:
      - name: Download proven image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: addon-image-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/image

      - name: Load proven image
        env:
          IMAGE_TAR: ${{ runner.temp }}/image/addon-image-${{ matrix.arch }}.tar
        run: docker load --input "$IMAGE_TAR"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish proven SHA and edge images
        env:
          SHA_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
          SHORT_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ needs.validate.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker image inspect "$SHA_REF" "$SHORT_REF" >/dev/null
          docker push "$SHA_REF"
          docker push "$SHORT_REF"

  smoke:
    runs-on: ${{ matrix.runner }}
    needs: push
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      # Needed by "Assert installed model registry": it hashes the canonical
      # root model_registry.toml against the copy baked into the image. Without
      # a checkout the file is absent on the runner and the step fails.
      # Read-only: this checkout only reads the registry for hashing, so the
      # token is not persisted into .git/config (zizmor: artipacked).
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact SHA image
        id: pull_image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
        run: docker pull "$IMAGE_REF"

      - name: Assert installed recovery assets
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
        run: |
          IMAGE="$IMAGE_REF"
          docker run --rm -i "$IMAGE" python3 - <<'PY'
          from importlib import resources
          from pathlib import Path
          import subprocess

          from mammamiradio.core.packaged_assets import DEMO_ASSETS_DIR
          from mammamiradio.core.spoken_assets import is_approved_packaged_audio_asset

          REQUIRED_RECOVERY_ASSETS = ("continuity_1.mp3", "emergency_tone.mp3")

          try:
              recovery_dir = resources.files("mammamiradio").joinpath("assets", "demo", "recovery")
          except ModuleNotFoundError as exc:
              raise SystemExit(f"cannot import mammamiradio package: {exc}") from exc

          try:
              clips = {
                  clip.name: clip
                  for clip in recovery_dir.iterdir()
                  if clip.is_file() and clip.name.endswith(".mp3")
              }
          except (FileNotFoundError, NotADirectoryError, OSError) as exc:
              raise SystemExit(f"missing recovery asset directory in installed image: {exc}") from exc

          failures = []
          for asset_name in REQUIRED_RECOVERY_ASSETS:
              clip = clips.get(asset_name)
              if clip is None:
                  failures.append(f"{asset_name}: missing")
                  continue
              try:
                  size = len(clip.read_bytes())
              except OSError as exc:
                  failures.append(f"{asset_name}: unreadable ({exc})")
                  continue
              if size <= 1024:
                  failures.append(f"{asset_name}: only {size} bytes")
                  continue
              asset_path = Path(DEMO_ASSETS_DIR) / "recovery" / asset_name
              if not is_approved_packaged_audio_asset(asset_path, assets_root=Path(DEMO_ASSETS_DIR)):
                  failures.append(f"{asset_name}: manifest/hash validation failed")
                  continue

              try:
                  with resources.as_file(clip) as path:
                      result = subprocess.run(
                          [
                              "ffprobe",
                              "-v",
                              "error",
                              "-select_streams",
                              "a:0",
                              "-show_entries",
                              "stream=codec_type",
                              "-of",
                              "csv=p=0",
                              str(path),
                          ],
                          capture_output=True,
                          text=True,
                          timeout=10,
                      )
              except FileNotFoundError as exc:
                  raise SystemExit("ffprobe is not installed in the image") from exc
              except subprocess.TimeoutExpired:
                  failures.append(f"{asset_name}: ffprobe timed out")
                  continue

              stdout = result.stdout.strip()
              stderr = result.stderr.strip()
              if result.returncode == 0 and "audio" in stdout.lower():
                  print(f"recovery asset OK: {asset_name} ({size} bytes)")
                  continue
              failures.append(f"{asset_name}: {stderr or stdout or f'ffprobe exit {result.returncode}'}")

          if failures:
              raise SystemExit("required recovery asset validation failed: " + "; ".join(failures))
          PY

      - name: Assert installed model registry
        env:
          # Route trusted expansions through env so they reach the script as shell
          # variables, not inline ${{ }} interpolation (zizmor: template-injection).
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_REF"
          EXPECTED="$(sha256sum model_registry.toml | awk '{print $1}')"
          ACTUAL="$(docker run --rm -i "$IMAGE" python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          registry = Path("/app/model_registry.toml")
          if not registry.is_file():
              raise SystemExit("missing /app/model_registry.toml in installed image")
          print(sha256(registry.read_bytes()).hexdigest())
          PY
          )"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Installed model_registry.toml does not match the canonical root registry"
            exit 1
          fi
          echo "Installed model registry matches the canonical root registry"

      - name: Run built-image launch smoke
        if: ${{ always() && steps.pull_image.outcome == 'success' }}
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
        run: python3 scripts/ha-green-launch-smoke.py --image "$IMAGE_REF"

      - name: Verify published add-on port
        if: ${{ always() && steps.pull_image.outcome == 'success' }}
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
          SMOKE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          CONTAINER_NAME="mamma-published-${SMOKE_ARCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:8765:8000 \
            --env LOG_LEVEL=WARNING \
            --env SUPERVISOR_TOKEN=smoke-ci \
            "$IMAGE_REF"

          HEALTH="$(
            curl --fail --silent --show-error \
              --retry 20 --retry-all-errors --retry-delay 1 \
              --max-time 3 \
              http://127.0.0.1:8765/healthz
          )"
          python3 - "$HEALTH" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          if payload.get("status") != "ok":
              raise SystemExit(f"published /healthz was not healthy: {payload}")
          print("Published add-on port is reachable and healthy")
          PY
