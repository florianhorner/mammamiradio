name: Release HA Addon

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Prevent racing on rapid re-tags or manual re-triggers.
concurrency:
  group: addon-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/mammamiradio-addon

jobs:
  pre-flight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      publish_latest: ${{ steps.latest.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require tag ref
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Stable add-on releases must run from a tag ref, not ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Tag ref confirmed: ${GITHUB_REF_NAME}"

      - name: Validate semver tag format
        id: semver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' does not match vX.Y.Z semver format — only exact releases are stable-published"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG → version: $VERSION"

      - name: Check latest stable tag
        id: latest
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          git fetch --force --tags origin 'refs/tags/v*:refs/tags/v*'
          LATEST_STABLE="$(git tag -l 'v*' \
            | sed 's/^v//' \
            | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print }' \
            | sort -V \
            | tail -1)"
          if [ "$LATEST_STABLE" = "$VERSION" ]; then
            echo "publish_latest=true" >> "$GITHUB_OUTPUT"
            echo "Current tag is the newest stable version: $VERSION"
          else
            echo "publish_latest=false" >> "$GITHUB_OUTPUT"
            echo "Current tag $VERSION is older than newest stable version $LATEST_STABLE; :latest will not be moved"
          fi

      - name: Validate tag matches the full cut contract
        run: |
          CONFIG_VERSION=$(grep '^version:' ha-addon/mammamiradio/config.yaml | awk '{print $2}' | tr -d '"')
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/mammamiradio/manifest.json')).get('version',''))")
          PYPROJECT_VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          TAG_VERSION="${{ steps.semver.outputs.version }}"
          if [ "$CONFIG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::config.yaml version ($CONFIG_VERSION) does not match tag ($TAG_VERSION) — bump all three version files before tagging"
            exit 1
          fi
          # The HACS integration ships from this repo and rides the release number
          # (docs/release-process.md). A tagged commit must carry the matching manifest.
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::custom_components/mammamiradio/manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG_VERSION) — bump the integration manifest with the release"
            exit 1
          fi
          # pyproject is the third version file and the one that reaches runtime:
          # the addon Dockerfile pip-installs it, so it becomes the installed
          # dist-info that _ASSET_VERSION and bridge_app_version read. PR CI covers
          # this via pre-release-check.sh, but a hand-pushed or mistargeted tag never
          # sees PR CI — so the release path checks it against the tagged checkout too.
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VERSION) does not match tag ($TAG_VERSION) — bump all three version files before tagging"
            exit 1
          fi
          # The tagged commit must also describe its own release. Under the
          # cut-don't-open model the changelog fold lands IN the cut commit, so the
          # first versioned ha-addon CHANGELOG header is the release being tagged.
          # Trailing whitespace/CR is trimmed before the Unreleased comparison; without
          # it a stray space after "## Unreleased" would be read as a version heading.
          CHANGELOG_VERSION=$(awk '/^## / {v=$0; sub(/^##[[:space:]]+/, "", v); gsub(/[[:space:]\r]+$/, "", v); if (v != "Unreleased" && v != "[Unreleased]") {split(v, a, /[[:space:]]+/); h=a[1]; gsub(/^\[|\]$/, "", h); print h; exit}}' ha-addon/mammamiradio/CHANGELOG.md)
          if [ "$CHANGELOG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::ha-addon/mammamiradio/CHANGELOG.md's newest versioned heading is '${CHANGELOG_VERSION:-missing}' but the tag is $TAG_VERSION — fold the changelog in the cut commit, before tagging"
            exit 1
          fi
          echo "Cut contract confirmed at $TAG_VERSION: config.yaml, manifest.json, pyproject.toml, ha-addon CHANGELOG"

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Require prebuilt SHA images and check stable tags
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          for ARCH in amd64 aarch64; do
            SHA_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${ARCH}:${{ github.sha }}"
            VERSION_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${ARCH}:${VERSION}"

            if ! docker buildx imagetools inspect "$SHA_TAG" > /dev/null 2>&1; then
              echo "::error::Missing $SHA_TAG. Tag the already-built version-bump commit after addon-build.yml is green."
              exit 1
            fi
            SHA_DIGEST="$(printf 'sha256:%s' "$(docker buildx imagetools inspect "$SHA_TAG" --raw | sha256sum | awk '{print $1}')")"
            echo "Prebuilt SHA image found: $SHA_TAG ($SHA_DIGEST)"

            if docker buildx imagetools inspect "$VERSION_TAG" > /dev/null 2>&1; then
              VERSION_DIGEST="$(printf 'sha256:%s' "$(docker buildx imagetools inspect "$VERSION_TAG" --raw | sha256sum | awk '{print $1}')")"
              if [ "$VERSION_DIGEST" != "$SHA_DIGEST" ]; then
                echo "::error::Tag $VERSION_TAG already exists but does not match $SHA_TAG — delete the bad registry tag manually before retrying"
                exit 1
              fi
              echo "Existing version tag matches $SHA_TAG; rerun recovery is allowed for $ARCH"
            else
              echo "Stable version tag is not published yet: $VERSION_TAG"
            fi
          done

  smoke-prebuilt:
    runs-on: ${{ matrix.runner }}
    needs: pre-flight
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            docker_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            docker_arch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact prebuilt SHA image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
        run: docker pull "$IMAGE_REF"

      - name: Run exact prebuilt SHA launch smoke
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
        run: python3 scripts/ha-green-launch-smoke.py --image "$IMAGE_REF"

      - name: Verify exact prebuilt SHA published add-on port
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}
          EXPECTED_DOCKER_ARCH: ${{ matrix.docker_arch }}
          SMOKE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ACTUAL_DOCKER_ARCH="$(docker image inspect "$IMAGE_REF" --format '{{.Architecture}}')"
          if [ "$ACTUAL_DOCKER_ARCH" != "$EXPECTED_DOCKER_ARCH" ]; then
            echo "::error::Expected $SMOKE_ARCH image architecture $EXPECTED_DOCKER_ARCH, got $ACTUAL_DOCKER_ARCH"
            exit 1
          fi

          CONTAINER_NAME="mamma-release-published-${SMOKE_ARCH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$CONTAINER_NAME" \
            --publish 127.0.0.1:8765:8000 \
            --env LOG_LEVEL=WARNING \
            --env SUPERVISOR_TOKEN=smoke-ci \
            "$IMAGE_REF"

          HEALTH="$(
            curl --fail --silent --show-error \
              --retry 20 --retry-all-errors --retry-delay 1 \
              --max-time 3 \
              http://127.0.0.1:8765/healthz
          )"
          python3 - "$HEALTH" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          if payload.get("status") != "ok":
              raise SystemExit(f"published /healthz was not healthy: {payload}")
          print("Exact prebuilt SHA published add-on port is reachable and healthy")
          PY

  promote:
    runs-on: ubuntu-latest
    needs: [pre-flight, smoke-prebuilt]
    if: github.repository == 'florianhorner/mammamiradio'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote SHA image to stable tags
        run: |
          VERSION="${{ needs.pre-flight.outputs.version }}"
          SHA_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${{ github.sha }}"
          VERSION_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:${VERSION}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.arch }}:latest"

          SHA_DIGEST="$(printf 'sha256:%s' "$(docker buildx imagetools inspect "$SHA_TAG" --raw | sha256sum | awk '{print $1}')")"
          if docker buildx imagetools inspect "$VERSION_TAG" > /dev/null 2>&1; then
            VERSION_DIGEST="$(printf 'sha256:%s' "$(docker buildx imagetools inspect "$VERSION_TAG" --raw | sha256sum | awk '{print $1}')")"
            if [ "$VERSION_DIGEST" != "$SHA_DIGEST" ]; then
              echo "::error::Refusing to overwrite $VERSION_TAG ($VERSION_DIGEST) with $SHA_TAG ($SHA_DIGEST)"
              exit 1
            fi
            echo "Version tag already matches $SHA_TAG; leaving immutable tag in place"
          else
            docker buildx imagetools create --prefer-index=false --tag "$VERSION_TAG" "$SHA_TAG"
            echo "Published $VERSION_TAG from $SHA_TAG"
          fi

          # Re-verify this tag is still the newest stable before updating :latest.
          # Closes the TOCTOU window: a newer tag may have been promoted while this
          # run was in-progress since publish_latest was computed in pre-flight.
          PUBLISH_LATEST="${{ needs.pre-flight.outputs.publish_latest }}"
          if [ "$PUBLISH_LATEST" = "true" ]; then
            git fetch --force --tags origin 'refs/tags/v*:refs/tags/v*'
            CURRENT_LATEST="$(git tag -l 'v*' \
              | sed 's/^v//' \
              | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print }' \
              | sort -V \
              | tail -1)"
            if [ "$CURRENT_LATEST" != "$VERSION" ]; then
              echo "Tag $VERSION is no longer the newest stable ($CURRENT_LATEST was published concurrently); skipping :latest update."
              PUBLISH_LATEST="false"
            fi
          fi
          if [ "$PUBLISH_LATEST" = "true" ]; then
            docker buildx imagetools create --prefer-index=false --tag "$LATEST_TAG" "$SHA_TAG"
            echo "Updated $LATEST_TAG from $SHA_TAG"
          else
            echo "Skipping $LATEST_TAG because $VERSION is not the newest stable tag"
          fi

  smoke:
    runs-on: ubuntu-latest
    needs: [pre-flight, promote]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull amd64 release image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-amd64:${{ needs.pre-flight.outputs.version }}

      - name: Run release image smoke test
        run: |
          set -euo pipefail
          # Supervisor always sets SUPERVISOR_TOKEN; the addon's tokenless-LAN-admin
          # path requires it (see config._is_addon). Without it the image boots in
          # standalone mode, where binding 0.0.0.0 with no admin token is a fatal
          # config error and uvicorn never starts.
          docker run -d --name mamma-smoke \
            -p 8765:8000 \
            -e LOG_LEVEL=WARNING \
            -e SUPERVISOR_TOKEN=smoke-ci \
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-amd64:${{ needs.pre-flight.outputs.version }}
          sleep 40
          HEALTH=$(curl -sS --retry 8 --retry-delay 3 --retry-connrefused http://localhost:8765/healthz)
          echo "$HEALTH"
          STATUS=$(echo "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          QE=$(echo "$HEALTH" | python3 -c 'import json,sys; print(float(json.load(sys.stdin).get("queue_empty_elapsed_s",0) or 0))')
          if [ "$STATUS" = "failing" ] || awk "BEGIN{exit !($QE > 30)}"; then
            echo "::error::Smoke failed: status=$STATUS queue_empty_elapsed_s=$QE"
            docker logs mamma-smoke 2>&1 | tail -50
            exit 1
          fi
          echo "Smoke OK: status=$STATUS queue_empty_elapsed_s=$QE"
          docker logs mamma-smoke 2>&1 | tail -50

      - name: Cleanup
        if: always()
        run: docker stop mamma-smoke && docker rm mamma-smoke || true
