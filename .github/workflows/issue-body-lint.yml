name: issue-body-lint

# Editorial boundary for maintainer-authored issue bodies.
# See CLAUDE.md "Changelog editorial boundary".
#
# Shared patterns come from florianhorner/gh-workflows; scripts/lint-patterns.sh
# carries this repo's own and is unioned in via extra_patterns.
#
# Quiet failure by design is preserved: a red X in the Actions tab and the
# actor's own notification, nothing else. No bot comment and no label —
# publicly flagging an editorial violation would itself put process narrative
# on the tracker.

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-body-lint-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  lint:
    # The editorial boundary binds maintainer/agent-authored copy only.
    # Outside contributors' bug reports are never linted.
    if: github.event.issue.user.login == 'florianhorner'
    # Required, not optional — see the note in pr-body-lint.yml.
    permissions:
      contents: read
      actions: read
    uses: florianhorner/gh-workflows/.github/workflows/body-lint.yml@700f7ce60a9c030bac22437fcc2775c70b2bf079 # v1.4
    with:
      target: issue-body
      extra_patterns: scripts/lint-patterns.sh
