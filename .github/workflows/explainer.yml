name: Explainer

# The interactive explainer under docs/explainer/ carries its own test suite,
# including the framing guards that keep the page station-first. Until this
# workflow existed those tests ran only when someone remembered to type
# `npm test` locally — a guard nobody runs is not a guard.
#
# Honest scope: string assertions and the build cannot exercise real MP3
# decoding, timeupdate, autoplay rejection, or stalled playback. This job
# catches framing regressions and schema drift; playback behavior is covered
# by the pure-function phase tests plus the manual verification steps in
# docs/explainer/README.md.

on:
  push:
    branches: [main]
    paths: ["docs/explainer/**", ".github/workflows/explainer.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/explainer/**", ".github/workflows/explainer.yml"]

permissions:
  contents: read

jobs:
  explainer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/explainer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # The workflow sits in its own path filter, so it also fires on refs where
      # the page does not exist yet — every step below would fail on a missing
      # working-directory. Absent page is "nothing to test", not a failure.
      - name: Is there a page to test?
        id: page
        working-directory: .
        run: |
          if [ -f docs/explainer/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::docs/explainer is not on this ref - skipping the explainer suite."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.page.outputs.present == 'true'
        with:
          node-version: "22.17.1"
          check-latest: false
      - name: Install
        if: steps.page.outputs.present == 'true'
        run: npm ci
      - name: Test (includes framing guards and build validation)
        if: steps.page.outputs.present == 'true'
        run: npm test
      - name: Build static site
        if: steps.page.outputs.present == 'true'
        run: npm run build
      - name: Install Chromium for the funnel test
        if: steps.page.outputs.present == 'true'
        run: npx playwright install chromium --with-deps
      - name: Funnel end-to-end (real browser, reduced motion)
        if: steps.page.outputs.present == 'true'
        run: npm run test:e2e
