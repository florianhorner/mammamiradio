name: land-queue

# Shadow land queue, phase 1: REPORT-ONLY.
#
# Runs scripts/land-queue-plan.sh — the decision engine an auto-land controller
# would act on — and writes its verdict to the job summary. It pushes nothing,
# comments nowhere, arms no merge, and never touches the edge channel. The point
# of this phase is to compare its choices against the human landing seat's
# actual scripts/land-pr.sh choices for a week before anything is automated.
#
# Same staging, and the same reason, as preship-evidence.yml: observe the real
# behaviour before it blocks or acts.
#
# What flipping this to LIVE requires (not a default, an explicit decision):
#   1. A GitHub App installed on this repo with contents:write +
#      pull-requests:write, and its credentials in Actions secrets. GITHUB_TOKEN
#      is NOT sufficient: commits it pushes do not trigger `push`/`pull_request`
#      workflows, so a reattest commit pushed with it would land with no CI and
#      the queue would arm a head no check ever ran against.
#   2. A `v*` tag-protection ruleset, so the App cannot cut a stable release.
#   3. Settling whether `UNSTABLE` is landable here — that reads "required checks
#      green", which is only as strong as the required-contexts list on main.
#      Confirm with scripts/check-merge-gate.sh from a seat that can read branch
#      protection.
#
# Kill switches: delete .github/land-queue.enabled, or set repository variable
# LAND_QUEUE=0. Either one stops the run.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: land-queue
  cancel-in-progress: false

jobs:
  plan:
    name: land queue decision (shadow)
    runs-on: ubuntu-latest
    # Cheap half of the kill switch: no checkout, no runner time. The other half
    # (.github/land-queue.enabled) is enforced inside land-queue-plan.sh, so
    # "off" means off from every invocation path, not just this workflow.
    if: vars.LAND_QUEUE != '0'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The evidence gate hashes the recursive git tree of the PR head and
          # compares it against receipts pinned to older commits; a shallow
          # clone cannot resolve those objects. This also fetches origin/main,
          # so the edge lane needs no separate fetch.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # ONE pass. The planner queries GitHub once and emits both renderings:
      # the human summary on stdout and the machine-readable decision to the
      # file. Running it twice doubled every round trip and let the two outputs
      # disagree, since they sampled GitHub seconds apart.
      - name: Plan the queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo '## Land queue — shadow decision'
            echo
            echo 'Report-only. This run changed nothing.'
            echo
            echo '```'
            bash scripts/land-queue-plan.sh --json-out land-queue-decision.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: hashFiles('land-queue-decision.json') != ''
        with:
          name: land-queue-decision
          path: land-queue-decision.json
          retention-days: 14
