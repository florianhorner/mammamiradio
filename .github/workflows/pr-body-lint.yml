name: pr-body-lint

# Editorial boundary for PR bodies. See CLAUDE.md "Changelog editorial boundary".
#
# The shared baseline lives in florianhorner/gh-workflows and matches the
# grammatical SHAPE of a violation rather than a literal phrase, so a paraphrase
# of a banned class does not walk through. This repo's own patterns are unioned
# in via extra_patterns; a repo may only ADD.
#
# The reusable workflow checks out the caller's BASE ref, preserving the
# property this workflow already had: a pull request cannot weaken the gate that
# is judging it in the same change.

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]

concurrency:
  group: pr-body-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    # Required, not optional. A called workflow's permissions can only be
    # maintained or reduced relative to the caller, never elevated, and an
    # attempted elevation is refused before anything runs: startup_failure,
    # with no logs and no check run to inspect.
    permissions:
      contents: read
      actions: read
    uses: florianhorner/gh-workflows/.github/workflows/body-lint.yml@700f7ce60a9c030bac22437fcc2775c70b2bf079 # v1.4
    with:
      target: pr-body
      extra_patterns: scripts/lint-patterns.sh
