<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banter review</title>
  <style>
    :root { color-scheme: dark; --bg:#161310; --fg:#f3ead8; --muted:#9b8574; --line:#3a312b; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,sans-serif; }
    main { width:min(100% - 24px, 760px); margin:24px auto 64px; }
    h1 { font-size:1.5rem; margin:0 0 8px; }
    .meta, .warn { color:var(--muted); font-size:.9rem; }
    .warn { color:#fbbf24; display:none; }
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
    button, textarea, input { font:inherit; }
    button { min-height:40px; padding:6px 12px; cursor:pointer; }
    article { border:1px solid var(--line); border-radius:8px; padding:16px; margin:16px 0; }
    article[data-decision="keep"] { border-left:4px solid #3b82f6; }
    article[data-decision="maybe"] { border-left:4px solid #d97706; }
    article[data-decision="redo"] { border-left:4px solid #dc2626; }
    audio { width:100%; margin:10px 0; }
    .verdict { display:flex; gap:8px; }
    textarea { width:100%; min-height:72px; margin-top:8px; }
    details { margin-top:8px; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Banter review</h1>
  <p class="meta" id="summary"></p>
  <p class="warn" id="warn">Could not save in this browser. Export JSON to keep verdicts.</p>
  <div class="bar">
    <button type="button" id="exportBtn">Export</button>
    <button type="button" id="importBtn">Import</button>
    <button type="button" id="resetBtn">Reset</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
  <div id="clips"></div>
</main>
<script>
  const REPORT = __REVIEW_REPORT__;
  const CONTEXT_AUDIO = __CONTEXT_AUDIO__;
  const APPROVED = __APPROVED_FEEDBACK__;
  const SET_ID = REPORT.clips.map((clip) => clip.sha256.slice(0, 8)).join("-");
  const STORAGE_KEY = `mmr-banter-feedback-${SET_ID}`;
  const clipById = Object.fromEntries(REPORT.clips.map((clip) => [clip.id, clip]));
  const DECISIONS = new Set(["keep", "maybe", "redo"]);
  let state = loadState();
  let contextAudio = null;

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[char]));
  }

  function blank() {
    return { schema_version: "1", candidate_set: SET_ID, cleared: false, clips: {} };
  }

  function bind(id, entry) {
    const clip = clipById[id];
    if (!clip || !entry || entry.sha256 !== clip.sha256) return null;
    return {
      sha256: clip.sha256,
      decision: DECISIONS.has(entry.decision) ? entry.decision : "",
      notes: typeof entry.notes === "string" ? entry.notes : ""
    };
  }

  function approvedState() {
    const clips = {};
    Object.entries(APPROVED || {}).forEach(([id, entry]) => {
      const bound = bind(id, entry);
      if (bound) clips[id] = bound;
    });
    return { ...blank(), clips };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return approvedState();
      const stored = JSON.parse(raw);
      if (stored && stored.cleared) return { ...blank(), cleared: true, clips: {} };
      if (!stored || (stored.candidate_set && stored.candidate_set !== SET_ID)) return approvedState();
      const clips = {};
      Object.entries(stored.clips || {}).forEach(([id, entry]) => {
        const bound = bind(id, entry);
        if (bound) clips[id] = bound;
      });
      return { ...blank(), clips };
    } catch (_) {
      return approvedState();
    }
  }

  function feedbackFor(id) {
    return state.clips[id] || { sha256: clipById[id].sha256, decision: "", notes: "" };
  }

  function persistState() {
    const warn = document.getElementById("warn");
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (warn) warn.style.display = "none";
    } catch (_) {
      if (warn) warn.style.display = "block";
    }
  }

  function updateFeedback(id, patch) {
    state.cleared = false;
    state.clips[id] = { ...feedbackFor(id), ...patch, sha256: clipById[id].sha256 };
    persistState();
    syncCard(id);
    syncSummary();
  }

  function resetBoard() {
    state = { ...blank(), cleared: true, clips: {} };
    persistState();
    REPORT.clips.forEach((clip) => syncCard(clip.id));
    syncSummary();
  }

  function syncCard(id) {
    const card = document.getElementById(`clip-${id}`);
    if (!card) return;
    const feedback = feedbackFor(id);
    card.dataset.decision = feedback.decision || "";
    card.querySelectorAll("[data-decision]").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.value === feedback.decision));
    });
    const notes = card.querySelector("[data-notes]");
    if (notes && document.activeElement !== notes) notes.value = feedback.notes || "";
  }

  function syncSummary() {
    const reviewed = REPORT.clips.filter((clip) => feedbackFor(clip.id).decision).length;
    const node = document.getElementById("summary");
    if (node) node.textContent = `${reviewed} / ${REPORT.clips.length} reviewed`;
  }

  function stopContext() {
    if (!contextAudio) return;
    contextAudio.pause();
    contextAudio.src = "";
    contextAudio = null;
  }

  function playContext(src, clipAudio) {
    stopContext();
    document.querySelectorAll("audio").forEach((audio) => audio.pause());
    contextAudio = new Audio(src);
    contextAudio.addEventListener("loadedmetadata", () => {
      contextAudio.currentTime = Math.max(0, contextAudio.duration - 25);
      contextAudio.play().catch(() => stopContext());
    }, { once: true });
    contextAudio.addEventListener("ended", () => {
      stopContext();
      clipAudio.currentTime = 0;
      clipAudio.play().catch(() => {});
    }, { once: true });
    contextAudio.addEventListener("error", stopContext, { once: true });
    contextAudio.load();
  }

  function exportPayload() {
    return {
      schema_version: "1",
      candidate_set: SET_ID,
      clips: REPORT.clips.map((clip) => ({
        id: clip.id,
        title: clip.title || clip.id,
        mode: clip.mode,
        variant: clip.variant || "original",
        context: clip.context,
        sha256: clip.sha256,
        ...feedbackFor(clip.id)
      }))
    };
  }

  function renderBoard() {
    const root = document.getElementById("clips");
    if (!root) return;
    root.innerHTML = REPORT.clips.map((clip, index) => {
      const exact = clip.context === "exact_track";
      const title = escapeHtml(clip.title || clip.id);
      const transcript = (clip.transcript || []).map((line) =>
        `<p><b>${escapeHtml(line.host)}</b> ${escapeHtml(line.text)}</p>`
      ).join("");
      const contextSrc = exact ? escapeHtml(CONTEXT_AUDIO[clip.id] || "") : "";
      return `<article id="clip-${escapeHtml(clip.id)}" data-id="${escapeHtml(clip.id)}">
        <h2>${String(index + 1).padStart(2, "0")}. ${title}</h2>
        <p class="meta">${escapeHtml(clip.mode)} · ${exact ? "exact-track" : "evergreen"}</p>
        ${exact ? `<p class="meta">Predecessor: ${escapeHtml(clip.required_previous_track || clip.required_previous_starter_id || "")}</p>` : ""}
        <audio controls preload="metadata" src="${escapeHtml(clip.file)}"></audio>
        ${exact ? `<button type="button" data-context="${contextSrc}">Play predecessor</button>` : ""}
        <div class="verdict">
          <button type="button" data-decision data-value="keep">Keep</button>
          <button type="button" data-decision data-value="maybe">Maybe</button>
          <button type="button" data-decision data-value="redo">Redo</button>
        </div>
        <label>Notes<textarea data-notes></textarea></label>
        <details><summary>Transcript and direction</summary>${transcript}<p>${escapeHtml(clip.creative_direction || "")}</p></details>
      </article>`;
    }).join("");
    root.querySelectorAll("article").forEach((card) => {
      const id = card.dataset.id;
      card.querySelectorAll("[data-decision]").forEach((button) => button.addEventListener("click", () => {
        const current = feedbackFor(id).decision;
        updateFeedback(id, { decision: current === button.dataset.value ? "" : button.dataset.value });
      }));
      card.querySelector("[data-notes]").addEventListener("input", (event) => {
        updateFeedback(id, { notes: event.target.value });
      });
      const audio = card.querySelector("audio");
      audio.addEventListener("play", () => {
        stopContext();
        root.querySelectorAll("audio").forEach((other) => { if (other !== audio) other.pause(); });
      });
      const contextBtn = card.querySelector("[data-context]");
      if (contextBtn) contextBtn.addEventListener("click", () => playContext(contextBtn.dataset.context, audio));
      syncCard(id);
    });
    syncSummary();
  }

  function importFeedback(file) {
    const reader = new FileReader();
    reader.addEventListener("load", () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported.clips)) throw new Error("missing clips");
        if (imported.candidate_set && imported.candidate_set !== SET_ID) throw new Error("set mismatch");
        imported.clips.forEach((clip) => {
          const bound = bind(clip.id, clip);
          if (bound) state.clips[clip.id] = bound;
        });
        state.cleared = false;
        persistState();
        REPORT.clips.forEach((clip) => syncCard(clip.id));
        syncSummary();
      } catch (_) {
        const warn = document.getElementById("warn");
        if (warn) {
          warn.textContent = "That file is not valid feedback for this board.";
          warn.style.display = "block";
        }
      }
    });
    reader.readAsText(file);
  }

  document.getElementById("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(exportPayload(), null, 2) + "\n"], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "banter-feedback.json";
    link.click();
    URL.revokeObjectURL(url);
  });
  document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
  document.getElementById("importFile").addEventListener("change", (event) => {
    if (event.target.files[0]) importFeedback(event.target.files[0]);
    event.target.value = "";
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Clear saved verdicts for this board?")) resetBoard();
  });
  window.addEventListener("pagehide", persistState);
  window.BanterBoard = {
    loadState, persistState, resetBoard, updateFeedback, feedbackFor, exportPayload, getState: () => state
  };
  renderBoard();
</script>
</body>
</html>
